<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CONTABLE PRO | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #161e2d;
            --accent: #0ea5e9;
            --text: #f8fafc;
            --green: #10b981;
            --red: #ef4444;
            --border: #1e293b;
            --hover: #243049;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
        
        /* Dashboard Stats */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--border); transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .metric-title { font-size: 0.75rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 1.8rem; font-weight: 800; }
        
        /* Gráfico */
        .chart-container { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 40px; }

        /* Controles y Tabla */
        .table-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
        .search-box { background: var(--card); border: 1px solid var(--border); color: white; padding: 12px 20px; border-radius: 10px; flex-grow: 1; max-width: 400px; }
        
        .almacen-container { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1e293b; color: #94a3b8; padding: 15px; font-size: 0.8rem; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        tr:hover { background: var(--hover); }
        
        .stock-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .low-stock { background: rgba(239, 68, 68, 0.2); color: var(--red); }
        
        input { background: #0f172a; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--accent); }
        .btn-save { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .btn-save:hover { filter: brightness(1.2); }
        
        img.prod-img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; background: #334155; }

        @media (max-width: 768px) {
            .table-controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">CONTABLE<span style="color:white">PRO</span></div>
            <div id="status" style="font-size: 0.8rem; color: var(--green);">● Sistema Sincronizado</div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <div class="metric-title">Utilidad Neta</div>
                <div id="estado-resultado" class="metric-value" style="color: var(--green);">$0.00</div>
            </div>
            <div class="card">
                <div class="metric-title">Efectivo en Caja</div>
                <div id="efectivo-caja" class="metric-value">$0.00</div>
            </div>
            <div class="card">
                <div class="metric-title">Valor del Inventario</div>
                <div id="valor-inventario" class="metric-value" style="color: #f59e0b;">$0.00</div>
            </div>
            <div class="card">
                <div class="metric-title">Productos en Alerta</div>
                <div id="alertas-stock" class="metric-value" style="color: var(--red);">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="rendimientoChart" height="100"></canvas>
        </div>

        <div class="table-controls">
            <h2>📦 Gestión de Almacén</h2>
            <input type="text" id="busqueda" class="search-box" placeholder="Buscar producto por nombre..." onkeyup="filtrarProductos()">
        </div>

        <div class="almacen-container">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Stock</th>
                        <th>Costo Unit.</th>
                        <th>P. Venta</th>
                        <th>Margen</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-productos">
                    <tr><td colspan="6" style="text-align:center; padding: 40px;">Cargando base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const URL_TIENDA = "https://rdyclinraavkirzfigjl.supabase.co"; 
        const KEY_TIENDA = "sb_publishable_fEGEgkJNYMzVPgzDaEwlsg_W1XiFyt6";
        const dbContable = supabase.createClient(URL_TIENDA, KEY_TIENDA);

        let productosLocal = [];
        let miGrafico;

        async function cargarTodo() {
            await obtenerProductos();
            await obtenerFinanzas();
        }

        async function obtenerProductos() {
            const { data, error } = await dbContable.from('productos').select('*').order('name');
            if (error) return;
            
            productosLocal = data;
            renderizarTabla(data);
            actualizarValorInventario(data);
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('lista-productos');
            tbody.innerHTML = "";
            let alertas = 0;

            lista.forEach(p => {
                const stock = parseInt(p.stock);
                const costo = parseFloat(p.cost_price || 0);
                const precio = parseFloat(p.price || 0);
                const margen = precio > 0 ? (((precio - costo) / precio) * 100).toFixed(0) : 0;
                
                if(stock <= 5) alertas++;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div style="display:flex; align-items:center; gap:12px;">
                                <img src="${p.img}" class="prod-img">
                                <input type="text" style="width:180px" id="n-${p.id}" value="${p.name}">
                            </div>
                        </td>
                        <td>
                            <span class="stock-badge ${stock <= 5 ? 'low-stock' : ''}">${stock} uds</span><br>
                            <input type="number" id="s-${p.id}" value="${p.stock}" style="width:60px; margin-top:5px">
                        </td>
                        <td>$<input type="number" id="pc-${p.id}" value="${costo}" style="width:80px"></td>
                        <td>$<input type="number" id="pv-${p.id}" value="${precio}" style="width:80px"></td>
                        <td style="color: ${margen > 20 ? 'var(--green)' : '#94a3b8'}">${margen}%</td>
                        <td><button class="btn-save" onclick="guardarCambios(${p.id})">Sincronizar</button></td>
                    </tr>
                `;
            });
            document.getElementById('alertas-stock').innerText = alertas;
        }

        function filtrarProductos() {
            const query = document.getElementById('busqueda').value.toLowerCase();
            const filtrados = productosLocal.filter(p => p.name.toLowerCase().includes(query));
            renderizarTabla(filtrados);
        }

        function actualizarValorInventario(data) {
            let total = data.reduce((acc, p) => acc + (parseFloat(p.cost_price || 0) * parseInt(p.stock || 0)), 0);
            document.getElementById('valor-inventario').innerText = `$${total.toLocaleString()}`;
        }

        async function guardarCambios(id) {
            const btn = event.target;
            btn.innerText = "wait...";
            
            const { error } = await dbContable.from('productos').update({
                name: document.getElementById(`n-${id}`).value,
                stock: document.getElementById(`s-${id}`).value,
                cost_price: document.getElementById(`pc-${id}`).value,
                price: document.getElementById(`pv-${id}`).value
            }).eq('id', id);

            if (error) alert("Error: " + error.message);
            else cargarTodo();
        }

        async function obtenerFinanzas() {
            const { data: movs, error } = await dbContable.from('contabilidad').select('*');
            if (error || !movs) return;

            let ingresos = 0;
            let utilidad = 0;
            let datosGrafico = { ingresos: 0, gastos: 0 };

            movs.forEach(m => {
                const monto = parseFloat(m.monto || 0);
                const ganancia = parseFloat(m.ganancia || 0);
                if (m.tipo === 'VENTA') {
                    ingresos += monto;
                    utilidad += ganancia;
                    datosGrafico.ingresos += monto;
                } else if (m.tipo === 'GASTO') {
                    utilidad -= monto;
                    datosGrafico.gastos += monto;
                }
            });

            document.getElementById('efectivo-caja').innerText = `$${ingresos.toLocaleString()}`;
            document.getElementById('estado-resultado').innerText = `$${utilidad.toLocaleString()}`;
            
            actualizarGrafico(datosGrafico);
        }

        function actualizarGrafico(datos) {
            const ctx = document.getElementById('rendimientoChart').getContext('2d');
            if (miGrafico) miGrafico.destroy();

            miGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Ingresos Brutos', 'Gastos Operativos'],
                    datasets: [{
                        label: 'Balance en USD',
                        data: [datos.ingresos, datos.gastos],
                        backgroundColor: ['#0ea5e9', '#ef4444'],
                        borderRadius: 8
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: '#1e293b' } } }
                }
            });
        }

        window.onload = cargarTodo;
    </script>
</body>
</html>
